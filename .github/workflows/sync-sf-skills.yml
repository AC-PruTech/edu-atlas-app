name: Sync Salesforce skills

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: sync
        run: bash scripts/sync-sf-skills.sh
      - name: Open a pull request when skills changed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sync.outputs.sha }}
          MISSING: ${{ steps.sync.outputs.missing }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          BRANCH="bot/sf-skills-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A .agents .claude
          git commit -m "chore: sync Salesforce skills to sf-skills@${SHA:0:7}"
          git push --force origin "$BRANCH"
          BODY="Updates the vendored skills in \`.agents/skills\` to [forcedotcom/sf-skills@${SHA:0:7}](https://github.com/forcedotcom/sf-skills/commit/$SHA). Review the diff before merging."
          if [ -n "$MISSING" ]; then BODY="$BODY

          These skills in \`.agents/sf-skills.txt\` no longer exist upstream and were removed: $MISSING"; fi
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$BODY"
          elif ! gh pr create --head "$BRANCH" --title "Sync Salesforce skills" --body "$BODY"; then
            # Repo setting "Allow GitHub Actions to create and approve pull requests" is off.
            # The branch is pushed; open the pull request from this link instead.
            echo "Skills updated on branch $BRANCH. Open a pull request: ${{ github.server_url }}/${{ github.repository }}/compare/$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
